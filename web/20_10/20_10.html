<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Chúc mừng 20/10</title>
  <style>
    body {
      background-color: #fff0f5;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      padding: 50px;
    }

    h1 {
      color: #e91e63;
      font-size: 3em;
    }

    .flower {
      margin: 20px auto;
      max-width: 300px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
    }

    .message {
      font-size: 1.5em;
      color: #880e4f;
      margin-top: 20px;
      animation: fadeIn 3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>
</head>
<body>

  <h1>💐 Chúc mừng 20/10 💐</h1>

  <img src="https://i.imgur.com/fZfZ4hS.png" alt="Bó hoa" class="flower">

  <div class="message">
    Chúc Trang của anh luôn xinh đẹp, hạnh phúc và thành công trong cuộc sống!💖
  </div>
  <div class="message">
    ❤Anh mong chung ta của tương lai vẫn sẽ luôn như vậyyy vẫn luôn bên nhau như này❤
  </div>
  <div class="message">
    ❤Dẫu thế giới có đổi thay nhưng anh vẫn chỉ mãi 1 lòng 1 dạ với em thuiii❤ 
  </div>
  <h1>❤Anh iu iemm❤</h1>

</body>
</html>
